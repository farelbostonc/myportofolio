<div class="star-form">
    {% if user.is_authenticated %}
        <form method="post" action="{% url 'main:toggle_star' project.id %}">
            {% csrf_token %}
            <button type="submit"
                    class="button button-star{% if project.is_starred %} is-starred{% endif %}">
                <span aria-hidden="true">★</span>
                {% if project.is_starred %}Batalkan star{% else %}Beri star{% endif %}
                <span class="star-count">{{ project.star_count }}</span>
            </button>
        </form>
    {% else %}
        <a href="{% url 'main:login' %}" class="button button-star">
            ★ Login untuk memberi star
            <span class="star-count">{{ project.star_count }}</span>
        </a>
    {% endif %}
</div>
